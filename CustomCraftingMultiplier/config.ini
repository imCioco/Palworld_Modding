; CustomCraftingMultiplier 1.0 - Crafting materials and consumables
; All values default to 1 (no additional change). Changes made after installing the mod will be reloaded within 10 seconds.
; Final yield amount = loaded recipe amount x Global x CategoryMultiplier x item.

; Multipliers scale the original batch: 20 ammo x 5 = 100; 10 arrows x 5 = 50.
; Materials and crafting time stay unchanged.

